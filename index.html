<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>khaldon license</title>
<style>
body{font-family:sans-serif;padding:14px;max-width:700px;margin:auto}
textarea{width:100%;height:110px;font-family:monospace;font-size:12px;direction:ltr;box-sizing:border-box}
input{width:100%;padding:10px;box-sizing:border-box;margin:4px 0;font-size:16px}
button{width:100%;padding:12px;margin:6px 0;font-size:16px;background:#0b6b5e;color:#fff;border:0;border-radius:8px}
section{border:1px solid #ccc;border-radius:8px;padding:10px;margin:12px 0}
</style>
</head>
<body>
<h2>1) إنشاء مفاتيح جديدة</h2>
<button id="gen">إنشاء زوج مفاتيح</button>
<p>المفتاح الخاص (احفظه فوراً في مدير كلمات المرور، ولا تشاركه):</p>
<textarea id="priv" readonly></textarea>
<p>المفتاح العام (ضعه في License.kt):</p>
<textarea id="pub" readonly></textarea>

<h2>2) إصدار ترخيص</h2>
<section>
<p>المفتاح الخاص:</p>
<textarea id="pk" placeholder="الصق المفتاح الخاص هنا"></textarea>
<input id="dev" placeholder="رقم الجهاز">
<input id="exp" type="date">
<button id="issue">إصدار الترخيص</button>
<p>الترخيص (انسخه وأرسله للعميل):</p>
<textarea id="out" readonly></textarea>
</section>

<script>
const enc = new TextEncoder();
const algo = { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' };
function b64(buf){ let s=''; for (const x of new Uint8Array(buf)) s+=String.fromCharCode(x); return btoa(s); }
function unb64(s){ const bin=atob(s.replace(/\s/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function pem(label, buf){ return '-----BEGIN '+label+'-----\n'+b64(buf).match(/.{1,64}/g).join('\n')+'\n-----END '+label+'-----'; }
function unpem(t){ return unb64(t.replace(/-----[^-]+-----/g,'')); }
function urlb64(buf){ return b64(buf).replace(/\+/g,'-').replace(/\//g,'_'); }

document.getElementById('gen').onclick = async () => {
  const kp = await crypto.subtle.generateKey(
    { ...algo, modulusLength: 2048, publicExponent: new Uint8Array([1,0,1]) }, true, ['sign','verify']);
  document.getElementById('priv').value = pem('PRIVATE KEY', await crypto.subtle.exportKey('pkcs8', kp.privateKey));
  document.getElementById('pub').value = b64(await crypto.subtle.exportKey('spki', kp.publicKey));
};

document.getElementById('issue').onclick = async () => {
  try {
    const d = document.getElementById('dev').value.trim();
    const e = document.getElementById('exp').value;
    if (!d || !e) throw new Error('أدخل رقم الجهاز وتاريخ الانتهاء');
    const key = await crypto.subtle.importKey('pkcs8', unpem(document.getElementById('pk').value), algo, false, ['sign']);
    const payload = enc.encode(JSON.stringify({ d, e }));
    const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, payload);
    document.getElementById('out').value = urlb64(payload) + '.' + urlb64(sig);
  } catch (x) { alert(x.message || x); }
};
</script>
</body>
</html>
